name: Pricing freshness check

on:
  schedule:
    # 07:15 UTC every Monday. Off the hour to avoid the scheduler's busiest
    # minute, which GitHub delays.
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The watcher drives a real browser: two of the six pricing pages are
      # unreadable without one (Cloudflare, and client-side rendering).
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run pricing check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/freshness/check.mjs

      - name: Commit snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain site/src/data/freshness)" ]; then
            echo "No snapshot change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/freshness
          git commit -m "chore(freshness): pricing snapshot $(date -u +%Y-%m-%d)"
          git push
